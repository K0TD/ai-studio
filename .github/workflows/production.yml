name: Production checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13-alpine3.23@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://studio_test:isolated-ci-password@127.0.0.1:5432/studio_test
      TEST_DATABASE_URL: postgresql://studio_test:isolated-ci-password@127.0.0.1:5432/studio_test
      ADMIN_LOGIN: production_admin
      ADMIN_PASSWORD: production-test-password
      BETTER_AUTH_SECRET: isolated-test-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      ROUTERAI_API_KEY: invalid-test-provider-key
      MEDIA_ROOT: /tmp/studio-ci-media
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: sh -n ops/backup.sh ops/backup-host.sh ops/restore.sh
      - run: bun run typecheck
      - run: bun run check
      - run: bun run --cwd apps/demo db:migrate
      - run: bun test
        env:
          NODE_ENV: test
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: bun audit --audit-level high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan full Git history with redacted findings
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag studio-app:ci .
