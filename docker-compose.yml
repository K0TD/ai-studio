name: studio

x-runtime: &runtime
  image: studio-app:${APP_IMAGE_TAG:-local}
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:mode=1777,size=128m
    - /app/apps/demo/.next/cache:uid=1001,gid=1001,mode=0770,size=128m
  environment: &application-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:-}
    ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:?Set ROUTERAI_API_KEY}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a unique BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS application URL}
    ADMIN_LOGIN: ${ADMIN_LOGIN:?Set ADMIN_LOGIN}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
    STORAGE_ROOT: /app/storage
    SQLITE_PATH: /app/storage/database/studio.sqlite
    QUOTE_MAXIMUM_MULTIPLIER: ${QUOTE_MAXIMUM_MULTIPLIER:-1.20}
  volumes:
    - media:/data/media
    - ./storage:/app/storage
  depends_on:
    media-init: { condition: service_completed_successfully }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    profiles: [postgres]
    image: postgres:16.13-alpine3.23@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  media-init:
    image: studio-app:${APP_IMAGE_TAG:-local}
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    security_opt: [no-new-privileges:true]
    volumes:
      - media:/data/media
      - ./storage:/app/storage
      - backup_work:/work
    command:
      [
        sh,
        -c,
        "mkdir -p /data/media /app/storage/database /app/storage/logs && chown -R 1001:1001 /data/media /app/storage /work && chmod -R 0775 /data/media /app/storage /work",
      ]

  web:
    <<: *runtime
    build: { context: ., dockerfile: Dockerfile }
    ports:
      - "127.0.0.1:${APP_PORT:-3050}:3000"
    expose: ["3000"]
    healthcheck:
      test: [CMD, bun, scripts/healthcheck.ts]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *runtime
    depends_on:
      media-init: { condition: service_completed_successfully }
      web: { condition: service_started }
    command: [bun, run, worker]
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, bun, scripts/worker-healthcheck.ts]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  init:
    <<: *runtime
    profiles: [ops]
    restart: "no"
    command: [sh, -c, "bun scripts/auto-migrate.ts && bun run sync-admin"]

  caddy:
    profiles: [caddy]
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backup:
    profiles: [ops]
    build: { context: ./ops, dockerfile: Dockerfile.backup }
    restart: "no"
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=128m"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-studio}
      PGPASSWORD: ${POSTGRES_PASSWORD:-studio}
      PGDATABASE: ${POSTGRES_DB:-studio}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_DEFAULT_REGION:-}
      RESTIC_CACHE_DIR: /work/restic-cache
    volumes:
      - media:/data/media:ro
      - ./storage:/app/storage:ro
      - backup_work:/work
      - ./secrets/restic-password:/run/secrets/restic_password:ro
    depends_on:
      media-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  media:
  backup_work:
  caddy_data:
  caddy_config:
